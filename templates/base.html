<!doctype html>
<!-- Base template for the Group 10 Recipes application -->
<html lang="en">
  <head>
    <!-- Basic meta tags for character set and responsive viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Page title defined by child templates via title block -->
    <title>{% block title %}Group 10 Recipes{% endblock %}</title>
    <!-- Bootstrap CSS from static vendor folder -->
    <link
      href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}"
    />
    <!-- Font Awesome icons -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}"
    />
    <!-- Custom application stylesheet -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css') }}"
    />

    <!-- Additional page-specific styles can be injected here -->
    {% block extra_style %}{% endblock %}
  </head>
  <body>
    <!-- Page header with navigation and user controls -->
    <header class="p-3">
      <div class="container">
        <div
          class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start"
        >
          <!-- Brand/logo link to home -->
          <a
            href="/"
            class="d-flex align-items-center mb-2 mb-lg-0 link-body-emphasis text-decoration-none"
          >
            <svg
              class="bi me-2"
              width="40"
              height="32"
              role="img"
              aria-label="Bootstrap"
            >
              <use xlink:href="#bootstrap"></use>
            </svg>
          </a>
          <!-- Navigation menu -->
          <ul
            class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0"
          >
            <li>
              <a
                href="/"
                class="nav-link px-2 {{ 'text-secondary' if request.path == '/' else 'text-dark' }}"
                >Home</a
              >
            </li>
            <li>
              <a
                href="/recipes"
                class="nav-link px-2 {{ 'text-secondary' if request.path == '/recipes' else 'text-dark' }}"
                >Recipes</a
              >
            </li>
            <li>
              <a
                href="/about"
                class="nav-link px-2 {{ 'text-secondary' if request.path == '/about' else 'text-dark' }}"
                >About</a
              >
            </li>
          </ul>

          <!-- User profile dropdown or login/signup links -->
          <div class="text-end">
            {% if session.user %}
            <div class="d-flex">
              <div class="dropdown text-end ms-2">
                <a
                  href="#"
                  class="d-block link-body-emphasis text-decoration-none dropdown-toggle"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  <!-- Circular avatar showing user's initial and color -->
                  <div
                    class="rounded-circle"
                    style="
                      background-color: {{ session.user.color }};
                      width: 32px;
                      height: 32px;
                      display: inline-block;
                      text-align: center;
                    "
                  >
                    <span>{{ session.user.short_name }}</span>
                  </div>
                </a>

                <ul class="dropdown-menu text-small">
                  <li>
                    <a class="dropdown-item" href="/new_recipe"
                      >New recipe...</a
                    >
                  </li>
                  <li><a class="dropdown-item" href="/profile">Profile</a></li>
                  <li><hr class="dropdown-divider" /></li>
                                  
                  <li>
                    <a class="dropdown-item" href="/saved">Saved</a></li>
                  <li><hr class="dropdown-divider" /></li>


                  <li>
                    <form action="/logout" method="post">
                      <button class="dropdown-item">Signout</button>
                    </form>
                  </li>
                </ul>
              </div>
            </div>

            {% else %}
            <!-- Links for guests -->
            <a href="/login" class="btn me-2">Login</a>
            <a href="/signup" class="btn btn-extra">Sign-up</a>
            {% endif %}
          </div>
        </div>
      </div>
    </header>

    <!-- Main page content injected by child templates -->
    {% block content %}{% endblock %}

    <!-- Footer section -->
    <div class="container">
      <footer
        class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"
      >
        <p class="col-md-4 mb-0 text-body-secondary">
          Group 10, Computer Studies 121.
        </p>
        <a
          href="/"
          class="col-md-4 d-flex align-items-center justify-content-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none"
          aria-label="Bootstrap"
        >
          <svg class="bi me-2" width="40" height="32" aria-hidden="true">
            <use xlink:href="#bootstrap"></use>
          </svg>
        </a>
      </footer>
    </div>

    <!-- Bootstrap bundle JS (includes Popper) -->
    <script
      src="{{ url_for('static', filename='vendor/bootstrap/js/bootstrap.bundle.min.js') }}"
    ></script>

    <!-- Page-specific scripts can be injected here -->
    {% block scripts %}{% endblock %}
  </body>
</html>
